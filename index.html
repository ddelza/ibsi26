<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>2027 고입 챙김판 · 광수중 3학년</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css?v=20261029b">
</head>
<body>
<div id="login" hidden>
  <form id="lgForm" class="lg-box">
    <h1>2027 고입 챙김판</h1>
    <p class="muted">광수중 3학년 담임 선생님용 — 학생별 지망학교와 입학요강 핵심, 준비 서류를 한눈에</p>
    <label class="fl" for="lgPw">비밀번호</label>
    <input id="lgPw" type="password" autocomplete="current-password" required>
    <label class="fl" for="lgBy">선생님 이름 <span class="muted">(선택 — 수정 기록에 남습니다)</span></label>
    <input id="lgBy" placeholder="예: 3-2 담임 홍길동">
    <button id="lgBtn" class="btn">들어가기</button>
    <p id="lgMsg" class="lg-msg"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><b>2027 고입 챙김판</b><span class="muted">광수중 3학년</span></div>
    <nav class="primary">
      <a data-nav="class" href="#class">반별 보기</a>
      <a data-nav="school" href="#school">학교별 보기</a>
    </nav>
    <nav class="secondary">
      <a data-nav="schedule" href="#schedule">📅 일정표</a>
      <a data-nav="status" href="#status">📊 진행 현황</a>
      <a data-nav="rules" href="#rules">📘 공통 규칙</a>
    </nav>
    <div class="me"><span id="who"></span><button id="btnReload" class="icon" title="시트에서 다시 불러오기">↻</button><button id="btnLogout" class="icon" title="로그아웃">⎋</button></div>
  </header>
  <div id="demoBanner" class="demo" hidden>체험용 가짜 데이터로 보는 중입니다 (실제 학생 정보 아님 · 저장해도 시트에 반영되지 않음)</div>
  <main id="main"></main>
  <footer class="foot">요강은 2026-10-29 각 학교 홈페이지 기준 · 지망학교·메모는 '2027 광수중 진학' 시트 '희망학교 입력' 탭과 연동 · ★ = 학교 문의 필요</footer>
</div>

<dialog id="dlg"></dialog>
<div id="toast" class="toast"></div>

<script src="js/config.js?v=20261029b"></script>
<script src="js/schools.js?v=20261029b"></script>
<script src="js/demo.js?v=20261029b"></script>
<script src="js/app.js?v=20261029b"></script>
</body>
</html>
